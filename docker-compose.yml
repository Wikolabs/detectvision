version: "3.9"

# detectvision demo - production-ready POC.
# 2 services orchestrated:
#   - detectvision (Next.js frontend on host port 3021)
#   - detectvision-backend (FastAPI Python, internal only on 8000)
# Shared external network wkdemo-net (created once by deploy.yml) avoids
# Docker default address-pool exhaustion across all 47 LP stacks.

services:
  detectvision-backend:
    image: ghcr.io/wikolabs/detectvision-backend:latest
    container_name: detectvision-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - wkdemo_net

  detectvision:
    image: ghcr.io/wikolabs/detectvision:latest
    container_name: detectvision
    restart: unless-stopped
    ports:
      - "3021:3000"
    environment:
      BACKEND_URL: "http://detectvision-backend:8000"
    depends_on:
      - detectvision-backend
    networks:
      - wkdemo_net

networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
