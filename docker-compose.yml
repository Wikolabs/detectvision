version: "3.9"

# detectvision demo — production-ready POC.
# 2 services orchestrated:
#   - detectvision (Next.js frontend on host port 3021)
#   - detectvision-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  detectvision-backend:
    image: ghcr.io/wikolabs/detectvision-backend:latest
    container_name: detectvision-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
networks:
  detectvision-net:
    name: detectvision-net
    driver: bridge